[package]
name = "conclave"
version = "0.1.0"
edition = "2021"
[lib]
name = "conclave"
crate-type = ["cdylib", "lib"]
[dependencies]
solana-program = "4.0.0"
solana-system-interface = { version = "3.0.0", features = ["bincode"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["access-control", "vrf", "modular-sdk"] }
conclave-vm = { path = "../crates/conclave-vm" }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
