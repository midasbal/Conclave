[workspace]
members = ["crates/conclave-vm", "crates/conclave-lab", "crates/conclave-conformance", "crates/conclave-conformance-tools"]
exclude = ["program", "tests/sbf", "tests/svm", "tests/svm/standins"]
resolver = "2"

[profile.release]
opt-level = 3
overflow-checks = true
lto = true
codegen-units = 1

# fuzzing: same optimisation and the same overflow checks, plus debug assertions; panics unwind so a finding is reported instead of killing the run
[profile.fuzz]
inherits = "release"
lto = false
debug-assertions = true
